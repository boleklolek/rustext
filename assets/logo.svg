<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4261" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f2335" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Rust Orange Facets -->
    <linearGradient id="orangeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#e0401d"/>
    </linearGradient>
    <linearGradient id="orangeSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#c23214"/>
    </linearGradient>
    <linearGradient id="orangeLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orangeShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Cyan Electric Facets -->
    <linearGradient id="cyanFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Titanium Highlights -->
    <linearGradient id="titaniumLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="160" cy="180" r="140" fill="#f97316" opacity="0.12" filter="url(#glow)"/>
  <circle cx="340" cy="240" r="120" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>

  <!-- Geometric Faceted 'R' -->
  <g transform="translate(10, 0)">
    <!-- 1. Left Spine Facet (Orange Top) -->
    <polygon points="160,110 230,110 230,260 160,330" fill="url(#orangeSpine)"/>

    <!-- 2. Left Spine Lower Facet (Cyan Wedge) -->
    <polygon points="160,330 230,260 230,390 160,390" fill="url(#cyanFacet1)"/>

    <!-- 3. Top Horizontal Bar (Bright Orange) -->
    <polygon points="160,110 320,110 280,180 230,180 230,110" fill="url(#orangeTop)"/>

    <!-- 4. Upper Outer Loop (Electric Cyan Wing) -->
    <polygon points="320,110 370,165 370,225 320,270 280,270 320,210 280,180 320,110" fill="url(#cyanFacet2)"/>

    <!-- 5. Inner Negative Space / Caret -->
    <polygon points="230,180 280,180 300,210 280,240 230,240" fill="#181926" opacity="0.95"/>

    <!-- 6. Diagonal Leg Upper Transition (Faceted Shading) -->
    <polygon points="230,240 280,240 320,270 260,290" fill="url(#orangeShade)"/>

    <!-- 7. Diagonal Leg Forward Cut (Bright Orange Core) -->
    <polygon points="260,290 320,270 370,390 300,390" fill="url(#orangeLeg)"/>

    <!-- 8. Polish Bevel / Highlight Edges -->
    <polyline points="160,390 160,110 320,110 370,165" fill="none" stroke="url(#titaniumLight)" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="230,240 320,270 370,390" fill="none" stroke="url(#titaniumLight)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
